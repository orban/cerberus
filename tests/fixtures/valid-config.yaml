adapter:
  command: "node ./tests/fixtures/agents/echo.js --scenario {{scenario}}"
  timeout: 5000

studies:
  - name: basic-test
    scenario: scenarios/simple.yaml
    contracts:
      - name: exits-cleanly
        type: code
        assert: "output.meta.exitCode === 0"
        threshold: 0.90
        confidence: 0.95
        trials: 30
