adapter:
  command: "node ./tests/fixtures/agents/flaky.js --scenario {{scenario}}"
  timeout: 5000

studies:
  - name: flaky-test
    scenario: scenarios/simple.yaml
    max_error_rate: 0.50
    contracts:
      - name: exits-cleanly
        type: code
        assert: "output.meta.exitCode === 0"
        threshold: 0.70
        confidence: 0.95
        trials: 50
