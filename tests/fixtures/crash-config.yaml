adapter:
  command: "node ./tests/fixtures/agents/crash.js --scenario {{scenario}}"
  timeout: 5000

studies:
  - name: crash-test
    scenario: scenarios/simple.yaml
    max_error_rate: 0.90
    contracts:
      - name: exits-cleanly
        type: code
        assert: "output.meta.exitCode === 0"
        threshold: 0.90
        confidence: 0.95
        trials: 5
