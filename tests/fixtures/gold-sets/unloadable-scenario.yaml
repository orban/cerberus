# A gold-set entry whose scenario cannot be loaded degrades to an unrated unit
# rather than ending the run, so this set is well-formed, provenanced and
# full-sized and still pairs only 15 units -- statistically indistinguishable
# from a judge that disagreed, which is why the runner names it on stderr.
