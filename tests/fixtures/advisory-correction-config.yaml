# Two gating code contracts and two advisory judge contracts. The corrected
# alphas the code contracts get here must match what they get in
# advisory-correction-baseline-config.yaml, where the judge contracts are gone
# from the config entirely: a hypothesis that cannot gate spends no alpha.
adapter:
  command: "node ./tests/fixtures/agents/echo.js --scenario {{scenario}}"
  timeout: 5000

judges:
  - model: "claude-3-5-sonnet-20241022"

studies:
  - name: correction-family
    scenario: scenarios/simple.yaml
    contracts:
      - name: exits-cleanly
        type: code
        assert: "output.meta.exitCode === 0"
        threshold: 0.90
        confidence: 0.95
        trials: 20

      - name: parses-json
        type: code
        assert: "output.meta.jsonParsed === true"
        threshold: 0.90
        confidence: 0.95
        trials: 20

      - name: advisory-one
        type: judge
        rubric: "Check output quality"
        threshold: 0.90
        confidence: 0.95
        trials: 20

      - name: advisory-two
        type: judge
        rubric: "Check output quality"
        threshold: 0.90
        confidence: 0.95
        trials: 20
