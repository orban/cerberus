adapter:
  command: "node ./tests/fixtures/agents/crash.js --scenario {{scenario}}"
  timeout: 5000

studies:
  - name: abort-test
    scenario: scenarios/simple.yaml
    max_error_rate: 0.10
    contracts:
      - name: always-passes
        type: code
        assert: "true"
        threshold: 0.90
        confidence: 0.95
        trials: 20
