# advisory-correction-config.yaml with the two advisory judge contracts deleted.
# The multiple-comparison family the code contracts see must be identical.
adapter:
  command: "node ./tests/fixtures/agents/echo.js --scenario {{scenario}}"
  timeout: 5000

studies:
  - name: correction-family
    scenario: scenarios/simple.yaml
    contracts:
      - name: exits-cleanly
        type: code
        assert: "output.meta.exitCode === 0"
        threshold: 0.90
        confidence: 0.95
        trials: 20

      - name: parses-json
        type: code
        assert: "output.meta.jsonParsed === true"
        threshold: 0.90
        confidence: 0.95
        trials: 20
